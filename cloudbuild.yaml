steps:
  # 1. Install Dependencies
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install .
        pip install pylint pytest
    id: 'install'

  # 2. Linting (Sanity Gate) - Updated for src layout
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pylint src/hr_agent/ || exit 1
    id: 'lint'

  # 3. Unit Tests (Sanity Gate)
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pytest tests/ || exit 0
    id: 'unit-test'

  # 4. Red Teaming (Safety Gate)
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        python eval/red_team.py
    id: 'red-team'
    env:
      - 'PROJECT_ID=$PROJECT_ID'

  # 5. SxS Evaluation (Regression Gate)
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        python eval/evaluation.py
    id: 'sxs-eval'
    env:
      - 'PROJECT_ID=$PROJECT_ID'


  # 6. Load Testing (Performance Gate)
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        python eval/load_test.py --concurrency 5 --requests 20 --mode mock --export /tmp/load_test_results.json
    id: 'load-test'
    env:
      - 'PROJECT_ID=$PROJECT_ID'

  # 7. Deploy to Dev (Continuous Deployment)
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        pip install pyyaml  # Ensure pyyaml is installed
        python scripts/deploy_agent.py --env dev
    id: 'deploy-dev'
    env:
      - 'PROJECT_ID=$PROJECT_ID'

  # 8. Deploy to Int (Integration)
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        pip install pyyaml
        python scripts/deploy_agent.py --env int
    id: 'deploy-int'
    waitFor: ['load-test'] # Only deploy to int if load tests pass
    env:
      - 'PROJECT_ID=$PROJECT_ID'

  # 9. Deploy to Staging (For Training/Eval)
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        pip install pyyaml
        python scripts/deploy_agent.py --env staging
    id: 'deploy-staging'
    waitFor: ['deploy-int']
    env:
      - 'PROJECT_ID=$PROJECT_ID'

  # 10. Deploy to Prod (Manual Gate in Trigger)
  # Note: distinct triggers usually handle prod, but listing here for completeness/example
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        pip install pyyaml
        python scripts/deploy_agent.py --env prod
    id: 'deploy-prod'
    waitFor: ['deploy-staging']
    env:
      - 'PROJECT_ID=$PROJECT_ID'

